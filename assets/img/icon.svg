<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Authentic Cinnabar Vermilion Red (朱砂印泥红) -->
    <linearGradient id="sealRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA241B" />
      <stop offset="100%" stop-color="#9A1811" />
    </linearGradient>
  </defs>

  <!-- Outer Carved Stone Seal Body -->
  <rect x="10" y="10" width="236" height="236" rx="22" ry="22" fill="url(#sealRed)" />

  <!-- Inner Seal Frame & 2x2 Four-Grid (四宫格界格) -->
  <rect x="24" y="24" width="208" height="208" rx="10" ry="10" fill="none" stroke="#FAF6EE" stroke-width="6.5" />
  <line x1="128" y1="24" x2="128" y2="232" stroke="#FAF6EE" stroke-width="5.2" />
  <line x1="24" y1="128" x2="232" y2="128" stroke="#FAF6EE" stroke-width="5.2" />

  <!-- Traditional Chinese Seal Reading Order (Right-to-Left, Top-to-Bottom):
       Top-Right: 黃 (黄) | Top-Left: 場 (场)
       Bottom-Right: 宇   | Bottom-Left: 印
  -->
  <g fill="none" stroke="#FAF6EE" stroke-width="7.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- [1] Top-Right Grid (128..232, 24..128): 小篆「黃」 -->
    <g>
      <!-- Upper 廿 / 艹 structure -->
      <path d="M148 45 H212" />
      <path d="M165 36 V54 C165 57, 195 57, 195 54 V36" />
      <!-- Middle wide horizontal bar -->
      <path d="M142 65 H218" />
      <!-- Central rounded 田 chamber -->
      <rect x="152" y="75" width="56" height="26" rx="8" />
      <line x1="180" y1="56" x2="180" y2="101" />
      <line x1="152" y1="88" x2="208" y2="88" />
      <!-- Lower legs (八) -->
      <path d="M167 109 C161 114, 154 117, 147 119" />
      <path d="M193 109 C199 114, 206 117, 213 119" />
    </g>

    <!-- [2] Bottom-Right Grid (128..232, 128..232): 小篆「宇」 -->
    <g>
      <!-- 宀 (Xiaozhuan dome roof) -->
      <path d="M180 140 V151" />
      <path d="M146 174 C147 156, 154 151, 180 151 C206 151, 213 156, 214 174" />
      <!-- 于 (Two horizontal bars + curved vertical stem) -->
      <path d="M159 169 H201" />
      <path d="M148 189 H212" />
      <path d="M180 169 V208 C180 216, 174 220, 162 221" />
    </g>

    <!-- [3] Top-Left Grid (24..128, 24..128): 小篆「場」 -->
    <g>
      <!-- Left 土 radical -->
      <path d="M38 64 H64" />
      <path d="M51 42 V94" />
      <path d="M38 98 L65 89" />
      <!-- Right 昜 structure: upper rounded 日 -->
      <rect x="74" y="40" width="36" height="26" rx="8" />
      <line x1="74" y1="53" x2="110" y2="53" />
      <!-- Middle horizontal bar -->
      <path d="M68 77 H116" />
      <!-- Lower 勿 with 3 sweeping Xiaozhuan strokes -->
      <path d="M84 77 C79 88, 72 96, 64 102" />
      <path d="M81 86 H111 C112 103, 108 115, 100 119" />
      <path d="M90 86 C85 98, 77 107, 68 113" />
      <path d="M101 86 C96 100, 88 111, 79 118" />
    </g>

    <!-- [4] Bottom-Left Grid (24..128, 128..232): 小篆「印」 -->
    <g>
      <!-- Left component of 印 -->
      <path d="M74 143 C64 147, 54 150, 46 152 V203" />
      <path d="M46 173 H70" />
      <path d="M44 203 L73 198" />
      <!-- Right 卩 component of 印 -->
      <path d="M84 150 V218" />
      <path d="M84 153 H110 C111 178, 110 198, 104 203 C100 206, 96 205, 93 203" />
    </g>

  </g>
</svg>
